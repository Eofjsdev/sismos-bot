name: Avisar actualizaciones de MichiHub en Telegram

on:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: michihub-updates-bot
  cancel-in-progress: false

jobs:
  revisar-actualizaciones:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Revisar y enviar actualizaciones nuevas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python send_updates.py

      - name: Guardar el registro de actualizaciones enviadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_updates.json
          git diff --staged --quiet || git commit -m "Actualizar registro de actualizaciones enviadas"
          git pull --rebase
          git push
